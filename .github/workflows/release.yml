name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before `lint`, which runs prettier in --write mode: it would reformat the
      # working tree and exit 0, so unformatted markdown could never fail CI.
      - name: Check markdown formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Runs against dist rather than src, so it covers the package exports map and
      # the template copy as well as the templates themselves. Rendering a template
      # says nothing about whether the code it produces compiles.
      - name: Verify generated applications build
        run: bun run verify:generated

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify provenance attestations
        run: npm audit signatures

      - name: Build package
        run: bun run build

      # Runs against dist rather than src, so it covers the package exports map and
      # the template copy as well as the templates themselves. Rendering a template
      # says nothing about whether the code it produces compiles.
      - name: Verify generated applications build
        run: bun run verify:generated

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
