name: Bug report
description: Something in MeoCord behaves differently than documented
labels: ['type: bug', 'status: needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security vulnerabilities —
        see [SECURITY.md](https://github.com/l7aromeo/meocord/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and discussions and found nothing matching
          required: true
        - label: I can reproduce this on the latest release of MeoCord
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        A minimal controller and the interaction that triggers the problem. A link to a repository
        is ideal; a pasted controller is fine. This is the single thing that most affects how fast
        a bug gets fixed.
      render: typescript
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the problem shows up. Pick the closest one.
      options:
        - Commands, components and routing
        - Autocomplete
        - Guards
        - Dependency injection and services
        - Decorators and metadata
        - Configuration (meocord.config.ts)
        - CLI — create / generate
        - CLI — build / start
        - Build output, bundleDependencies or native addons
        - Testing utilities (meocord/testing)
        - Types and editor experience
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: command-type
    attributes:
      label: Command type
      description: Leave blank if the problem is not tied to one.
      multiple: true
      options:
        - SLASH
        - CONTEXT_MENU
        - PRIMARY_ENTRY_POINT
        - BUTTON
        - SELECT_MENU
        - USER_SELECT_MENU
        - ROLE_SELECT_MENU
        - MENTIONABLE_SELECT_MENU
        - CHANNEL_SELECT_MENU
        - MODAL_SUBMIT
        - Message handler
        - Reaction handler

  - type: input
    id: regression
    attributes:
      label: Last version where this worked
      description: If this is a regression, the most recent MeoCord version where it behaved correctly.
      placeholder: 3.2.2

  - type: input
    id: meocord-version
    attributes:
      label: MeoCord version
      description: Output of `meocord --version`.
      placeholder: 4.0.0
    validations:
      required: true

  - type: input
    id: discordjs-version
    attributes:
      label: discord.js version
      placeholder: 14.27.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: What runs the bot.
      options:
        - Node.js
        - Bun
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: MeoCord requires Node.js 22.13 or newer.
      placeholder: node 22.13.0 / bun 1.4.2
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - npm
        - pnpm
        - yarn
        - bun
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any error or stack trace. Redact your bot token before pasting.
      render: shell
